<!DOCTYPE html>
<html lang="en" data-theme="default">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leads — Admin | Nova & Co.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .admin-wrap { max-width: 960px; margin: 0 auto; padding: 3rem 1.5rem; }
  .admin-toolbar { display: flex; gap: 0.75rem; margin-bottom: 2rem; flex-wrap: wrap; }
  .admin-toolbar input { flex: 1; min-width: 220px; padding: 0.85rem 1rem; border: 1px solid var(--color-border); border-radius: var(--radius-sm); font-family: var(--font-body); }
  table { width: 100%; border-collapse: collapse; background: var(--color-bg); border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); }
  th, td { text-align: left; padding: 0.9rem 1rem; border-bottom: 1px solid var(--color-border); font-size: 0.9rem; vertical-align: top; }
  th { background: var(--color-bg-alt); font-family: var(--font-heading); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--color-text-muted); }
  #admin-status { color: var(--color-text-muted); font-size: 0.9rem; margin-bottom: 1rem; }
</style>
</head>
<body>
<nav class="navbar"><div class="container"><a href="index.html" class="logo">Nova<span>&</span>Co.</a></div></nav>

<div class="admin-wrap">
  <h1 class="section-title">Leads</h1>
  <p class="section-sub" style="margin-bottom:1.5rem;">Every submission from the contact form on your site, stored locally in <code>backend/leads.db</code>.</p>

  <div class="admin-toolbar">
    <input type="password" id="admin-token" placeholder="Admin token (see .env)">
    <button class="btn btn-primary" id="admin-load">Load Leads</button>
  </div>
  <p id="admin-status"></p>
  <div style="overflow-x:auto;">
    <table>
      <thead><tr><th>Date</th><th>Name</th><th>Email</th><th>Phone</th><th>Message</th></tr></thead>
      <tbody id="admin-rows"></tbody>
    </table>
  </div>
</div>

<script>
document.getElementById('admin-load').addEventListener('click', async () => {
  const token = document.getElementById('admin-token').value.trim();
  const status = document.getElementById('admin-status');
  const rows = document.getElementById('admin-rows');
  status.textContent = 'Loading...';
  rows.innerHTML = '';
  try {
    const res = await fetch('/api/leads?token=' + encodeURIComponent(token));
    if (res.status === 401) { status.textContent = 'Invalid token.'; return; }
    if (!res.ok) throw new Error('Request failed');
    const leads = await res.json();
    status.textContent = leads.length + ' lead(s) found.';
    rows.innerHTML = leads.map(l => `
      <tr>
        <td>${new Date(l.created_at).toLocaleString()}</td>
        <td>${l.name}</td>
        <td>${l.email}</td>
        <td>${l.phone || '—'}</td>
        <td>${l.message}</td>
      </tr>`).join('');
  } catch (err) {
    status.textContent = 'Could not reach the local server. Run backend/app.py first.';
  }
});
</script>
</body>
</html>
